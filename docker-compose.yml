version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: aether-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecurepassword
      POSTGRES_DB: aether_mart_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: aether-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: aether-api-server
    restart: always
    environment:
      DATABASE_URL: "postgresql://postgres:supersecurepassword@postgres:5432/aether_mart_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      PORT: 5000
      NODE_ENV: production
      JWT_SECRET: "anotherjwtsecretkeyforproduction321"
      REFRESH_TOKEN_SECRET: "anotherrefreshsecretkeyforproduction321"
      ACCESS_TOKEN_EXPIRY: "15m"
      REFRESH_TOKEN_EXPIRY: "7d"
      COOKIE_SECRET: "cookiesecretphrase"
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis

  web-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aether-web-app
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api-server

volumes:
  postgres_data:
  redis_data:
